 function valid(f){const[w,d]=dim(f),br=BR();

   if(br.some(b=>cx<b[1]&&cx+1>b[0]&&cz<b[3]&&cz+1>b[2]))return false}

 function begin(f,isNew,fi){ed={f,isNew,fi,bak:{x:f.x,z:f.z,r:f.r}};pad=new T.Mesh(new T.PlaneGeometry(1,1),new T.MeshBasicMaterial({color:0x44ff44,transparent:true,opacity:.5,depthWrite:false}));pad.rotation.x=-Math.PI/2;sc.add(pad);
  ring.style.display='block';ring.querySelector('.se').style.display=isNew?'none':'block';

 function ground(x,y){v2.set(x/innerWidth*2-1,-y/innerHeight*2+1);rc2.setFromCamera(v2,cam);return rc2.ray.intersectPlane(gnd,pt)}

  if(a=='ok'){if(!valid(f))return toast('Tidak muat di sini!');if(ed.isNew&&!ed.fi&&!spend(p[5]))return;if(ed.fi)inv[f.k]--;list.push(f);end();toast('✨ '+p[1]+' terpasang!');save()}

  else{$('sht').textContent=cat[1];Object.keys(FC).filter(k=>cat[0]=='inv'?(inv[k]||0)>0:FC[k][0]==cat[0]).forEach(k=>{const p=FC[k],lk=cat[0]=='inv'?false:lvl<p[6],d=document.createElement('div');d.className='fcd'+(lk?' lk':'');d.innerHTML='<i>'+p[2]+'</i>'+p[1]+'<u>'+(cat[0]=='inv'?'x'+inv[k]:lk?'🔒 Level '+p[6]:'§'+p[5])+'</u>';
   d.onclick=()=>{if(lk)return toast('Terbuka di Level '+p[6]);if(cat[0]!='inv'&&coins<p[5])return toast('Koin kurang');const f=spot(k);if(!f)return toast('Tidak ada ruang kosong');shut();mesh(f);begin(f,true,cat[0]=='inv')};g.appendChild(d)})}if(!g.children.length)g.innerHTML='<p style="color:#fff;grid-column:1/-1;text-align:center;font-weight:700">Inventaris kosong</p>'}

  dump:()=>list.map(f=>[f.k,f.x,f.z,f.r]),load:d=>{if(d&&d.inv)Object.assign(inv,d.inv);if(d&&d.free)d.free.forEach(a=>{if(!FC[a[0]])return;const f={k:a[0],x:a[1],z:a[2],r:a[3]};mesh(f);list.push(f)})}}
})();

const RM=(()=>{
 const MAX=3,COST=25;let on=false,base=null,bars=[],drag=null,cam0=null;
 const st=document.createElement('style');st.textContent=`#rmui{display:none}body.rm #rmui{display:block}body.rm #tabs,body.rm #acts,body.rm #port,body.rm #lc,body.rm #shop{display:none!important}

 const ui=document.createElement('div');ui.id='rmui';ui.innerHTML='<div id="rmb">Tarik dinding bertanda putih untuk memperbesar ruangan.</div><div id="rmc"><button class="rb" id="rmn" style="background:#e53935">✕</button><span id="rmp"></span><button class="rb" id="rmy" style="background:#52b81f">✓</button></div><button class="rb" id="rmx">↩</button>';document.body.appendChild(ui);
 const gp=new T.Plane(new T.Vector3(0,1,0),0),rcr=new T.Raycaster(),v3=new T.Vector2(),pt=new T.Vector3();

 const area=e=>(8+e.w+e.e)*(6+e.n+e.s),clone=()=>JSON.parse(JSON.stringify(EXT));
 const cost=()=>Math.round(EXT.reduce((s,e,i)=>s+(area(e)-area(base[i])),0)*COST);
 function place(){bars.forEach(b=>{const q=RR(b.i),h=b.sd=='n'||b.sd=='s',fx=b.sd=='n'?q[2]:b.sd=='s'?q[3]:b.sd=='w'?q[0]:q[1],a=h?q[0]:q[2],z=h?q[1]:q[3];
  b.r=h?[a,z,fx,fx]:[fx,fx,a,z];b.m.scale.set(h?z-a:.7,1,h?.7:z-a);b.m.position.set(h?(a+z)/2:fx,2.7,h?fx:(a+z)/2)});

  [r==0?'n':'s',c==0?'w':'e'].forEach(sd=>{const m=new T.Mesh(new T.BoxGeometry(1,.25,1),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.8,depthTest:false}));m.renderOrder=9;sc.add(m);bars.push({i,sd,m,r:null})})}place()}

 function setExt(b,p){const q=rooms[b.i],e=EXT[b.i],k=b.sd;let v=k=='w'?q.ox-p.x:k=='e'?p.x-(q.ox+8):k=='n'?q.oz-p.z:p.z-(q.oz+6);v=Math.max(base[b.i][k],Math.min(MAX,Math.round(v)));if(e[k]!=v){e[k]=v;redo()}}

 const cv3=R.domElement;

 WL.forEach(w=>{const lo=w.sh||((cam.position.x-w.cx)*w.nx+(cam.position.z-w.cz)*w.nz>0),t=w.sh?.35:lo?.18:1;w.g.scale.y+=(t-w.g.scale.y)*Math.min(1,dt*8)});
 rooms.forEach((r,i)=>{if(!owned[i])r.lk.position.y=1.8+Math.sin(clock*2+i)*.12});slots.forEach(s=>{if(s.mk.visible)s.mk.children[1].position.y=1.3+Math.sin(clock*3)*.1});
 pb.position.set(boss.g.position.x,2.75+Math.sin(clock*3)*.1,boss.g.position.z);pb.rotation.y+=dt*2;if(pvChar)pvChar.rotation.y=Math.sin(clock*.6)*.3;
 sec+=dt;if(sec>=1){sec=0;$('cn').textContent=Math.floor(coins);$('gn').textContent=gems;$('lvn').textContent=lvl;$('lv').style.background='conic-gradient(#7de35a '+(xp/(lvl*150)*100)+'%,#fff 0)';$('eb').style.width=boss.energy+'%';
  $('dot').style.display=Q.some((q,i)=>q[1]()&&!claimed[i])?'block':'none';$('ab').textContent=boost>0?Math.ceil(boost):'✨';if(sel&&$('ebar'))$('ebar').textContent=Math.round(sel.energy);if(++sv>=5){sv=0;save()}}

fit();

else{buildCr();rebuild()}
